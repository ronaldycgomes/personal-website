    <style>
      html {
        scroll-behavior: smooth;
        overflow-x: clip;
      }

      body {
        min-height: 100vh;
        overflow-x: clip;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background-image:
          linear-gradient(rgba(15, 23, 42, 0.035) 1px, transparent 1px),
          linear-gradient(90deg, rgba(15, 23, 42, 0.035) 1px, transparent 1px);
        background-size: 34px 34px;
        mask-image: linear-gradient(180deg, rgba(0, 0, 0, 0.42), transparent 78%);
      }

      body[data-theme="dark"]::before {
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      }

      /* Offset scroll targets so the sticky header doesn't cover them */
      section[id],
      article[id] {
        scroll-margin-top: 90px;
      }

      /* Mobile: header is taller (2 rows), needs more offset */
      @media (max-width: 767px) {
        section[id],
        article[id] {
          scroll-margin-top: 130px;
        }
      }
      /* Scroll reveal */
      .reveal-pending {
        opacity: 0;
        transform: translateY(22px);
        will-change: transform, opacity;
      }

      .is-revealed {
        transition: opacity 0.78s cubic-bezier(0.16, 1, 0.3, 1),
                    transform 0.78s cubic-bezier(0.16, 1, 0.3, 1);
        opacity: 1 !important;
        transform: none !important;
      }

      /* Respeitar preferência de sistema "Reduzir movimento" */
      @media (prefers-reduced-motion: reduce) {
        .reveal-pending {
          opacity: 1;
          transform: none;
        }
        .is-revealed {
          transition: none;
        }
      }
    </style>
